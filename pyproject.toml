# The whole app as one uv project: `uv sync` once, then the short commands below (no cd, no PYTHONPATH).
#
#   uv run wbg-api            the API, Claude OFF (free features only)
#   uv run wbg-api --live     the API, Claude ON, at most US$ 5 this session (--cap N to change)
#   uv run wbg-web            the web app
#   uv run wbg-test           the offline tests
#
# See HOW_TO_RUN.md. infrastructure/lakebase_poc keeps its own small uv project (it needs numpy 2).

[project]
name = "wbg-procurement-intelligence"
version = "0.2.0"
description = "WBG Procurement Intelligence: the LangGraph app, its agents, ingestion, lesson cards and the Databricks ETL"
requires-python = "==3.12.*"
# The pins are the validated set the app runs with (formerly orchestrator/pyproject.toml).
dependencies = [
    "langgraph==1.1.10",
    "pydantic==2.13.3",
    "httpx==0.28.1",
    "anyio==4.11.0",
    "mcp==1.16.0",
    "fastmcp==2.12.5",
    "nemoguardrails==0.24.1",
    "logfire==5.3.0",
    "opentelemetry-sdk==1.45.1",
    "sqlglot==30.24.0",
    "psycopg[binary]==3.3.6",
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.4.1",
    "torch==2.9.1",
    "transformers==4.57.3",
    "pymupdf==1.26.7",
    "pandas==2.3.3",
    "python-dotenv==1.2.4",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg-pool==3.3.3",
    "databricks-connect==17.3.14",
    "fastapi==0.162.0",
    "pgvector==0.5.1",
    "scikit-learn==1.5.1",
    "presidio-analyzer==2.2.358",
    "presidio-anonymizer==2.2.358",
    # automated ingestion (ingest/): the same versions as the validated PDF extractor (rag/ingestion)
    "pdfplumber==0.11.9",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "watchdog==4.0.1",
    "pytesseract==0.3.13",
    "rapidfuzz==3.14.3",
    "tiktoken==0.8.0",
]

[project.scripts]
wbg-api = "wbg_orchestrator.commands:api"
wbg-web = "wbg_orchestrator.commands:web"
wbg-user = "wbg_orchestrator.commands:user"
wbg-test = "wbg_orchestrator.commands:test"
wbg-ingest = "wbg_orchestrator.commands:ingest"
wbg-lessons = "wbg_orchestrator.commands:lessons"
wbg-feedback = "wbg_orchestrator.commands:feedback"
wbg-feedback-db = "wbg_orchestrator.commands:feedback_db"
wbg-eval = "wbg_orchestrator.commands:evaluate"
wbg-logs = "wbg_orchestrator.commands:logs"
wbg-etl-watch = "etl.watch:run"
wbg-etl-seed = "etl.seed:run"

[dependency-groups]
dev = ["pytest>=8.3,<9"]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator/wbg_orchestrator"]

[tool.hatch.build]
# The editable install puts the repo root and orchestrator/ on the import path (what PYTHONPATH=..:. used to do).
dev-mode-dirs = [".", "orchestrator"]

[tool.pytest.ini_options]
# All tests live in tests/, one folder per component. tests/live/ is collected only with WBG_RUN_LIVE_TESTS=1.
testpaths = ["tests"]
